backend:
  name: github
  repo: SKT100/tax-client
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Statutory Compliance Due Dates
  - name: "compliance_section"
    label: "Compliance Deadlines"
    icon: "event"
    files:
      - file: "src/data/complianceDueDates.json"
        label: "Statutory Tax Calendar"
        name: "compliance_data"
        fields:
          - label: "Statutory Directives"
            name: "STATUTORY_DUE_DATES"
            widget: "list"
            summary: "{{fields.title}} • Due: {{fields.dueDate}}"
            fields:
              - { label: "Directive ID", name: "id", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "GST Lifecycle", value: "gst" }
                  - { label: "Income Tax & Advance Tax", value: "income-tax" }
                  - { label: "TDS / TCS Withholding", value: "tds" }
                  - { label: "PF, ESIC & P-Tax", value: "payroll" }
                  - { label: "Corporate & MCA", value: "corporate" }
              - { label: "Directive Title", name: "title", widget: "string" }
              - { label: "Governing Act / Section", name: "act", widget: "string" }
              - { label: "Due Date", name: "dueDate", widget: "string" }
              - { label: "Filing Frequency", name: "frequency", widget: "string" }
              - label: "Urgency Level"
                name: "urgency"
                widget: "select"
                options: ["critical", "standard"]
              - { label: "Target Assessee", name: "targetAssessee", widget: "string" }
              - { label: "Statutory Importance", name: "importance", widget: "text" }
              - { label: "Penal Consequence", name: "consequence", widget: "text" }

  # 2. Chamber & Firm Details
  - name: "firm_profile"
    label: "Firm Settings & Desk Info"
    icon: "business_center"
    files:
      - file: "src/data/firmSettings.json"
        label: "Chamber & Contact Data"
        name: "firm_data"
        fields:
          - { label: "Firm Name", name: "firm_name", widget: "string" }
          - { label: "Principal Practitioner", name: "principal_name", widget: "string" }
          - { label: "Official WhatsApp", name: "whatsapp_number", widget: "string" }
          - { label: "Chamber Email", name: "email", widget: "string" }
          - { label: "Baidyabati Chamber Address", name: "address_hq", widget: "string" }

  # 3. Blog & Legal Insights
  - name: "blog"
    label: "Tax Insights & Articles"
    icon: "feed"
    folder: "src/data/posts"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: 
          - "Direct Tax"
          - "GST Law"
          - "Audit Defense"
          - "Company Compliance"
          - "Trade Licences"
          - "General Updates"
      - label: "External Link / Social URL"
        name: "external_link"
        widget: "string"
        required: false
        hint: "Optional. Paste a Facebook post link, news URL, or official circular PDF if this post is from an external source."
      - label: "Cover Image"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "Optional. Optimal size <250 KB. If empty, default tax banner is used."
      - { label: "Executive Summary", name: "summary", widget: "text" }
      - label: "Full Statutory Brief / Body"
        name: "body"
        widget: "markdown"
        hint: "Paste the full text, Facebook caption, or press release notes here."